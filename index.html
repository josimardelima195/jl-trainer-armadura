<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#b9e84d" />
    <meta name="description" content="JL Trainer Armadura — treinos, alimentação e evolução." />
    <link rel="manifest" href="/manifest.json" />
    <title>JL Trainer Armadura</title>
    <style>
      html,body{margin:0;min-height:100%;background:#f4f8fd;color:#172b45;font-family:Arial,sans-serif}
      #boot-fallback{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
      #boot-fallback section{width:min(100%,460px);padding:28px;border:1px solid #d9e5f3;border-radius:18px;background:#fff;text-align:center;box-shadow:0 18px 50px rgba(20,50,90,.08)}
      #boot-fallback strong{display:block;margin-bottom:8px;font-size:22px}
      #boot-fallback p{margin:0;color:#60758f;line-height:1.6}
      #boot-fallback span{display:inline-grid;place-items:center;width:46px;height:46px;margin-bottom:18px;border-radius:14px;background:#e7f2ff;color:#1266ce;font-weight:800}
    </style>
  </head>
  <body>
    <div id="root">
      <main id="boot-fallback">
        <section>
          <span>JL</span>
          <strong>A iniciar o JL Trainer…</strong>
          <p>Estamos a carregar o seu painel. Se esta mensagem não desaparecer, volte a carregar a página.</p>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
